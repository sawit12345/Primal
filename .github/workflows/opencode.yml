name: OpenChamber

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Select Tunnel Provider'
        required: true
        default: 'tailscale'
        type: choice
        options:
          - tailscale
          - ngrok
          - cloudflare
      timeout_minutes:
        description: 'Auto-shutdown after (minutes)'
        required: true
        default: '300'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Git with Your Credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Clone All Your Repos
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          mkdir -p ~/repos
          cd ~/repos

          repos=$(curl -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/user/repos?per_page=100&affiliation=owner" \
            | jq -r '.[].clone_url')

          for repo in $repos; do
            echo "Cloning $repo..."
            git clone https://$GH_TOKEN@${repo#https://} || true
          done

      - name: Restore Session Data (Artifact)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: opencode-session
          path: /tmp/opencode-restore
          workflow: opencode.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
          repo: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Restored Session Data
        run: |
          echo "=== RESTORE DEBUG ==="
          echo "Contents of /tmp/opencode-restore:"
          ls -la /tmp/opencode-restore/ 2>/dev/null || echo "Directory does not exist"

          if [ -d "/tmp/opencode-restore" ]; then
            echo "Found restore directory, checking contents..."
            find /tmp/opencode-restore -type f 2>/dev/null || echo "No files found"

            mkdir -p ~/.config/opencode ~/.local/share/opencode/project ~/.local/state/opencode
            mkdir -p ~/.config/openchamber

            if [ -d "/tmp/opencode-restore/config" ]; then
              echo "Restoring OpenCode config files..."
              cp -rv /tmp/opencode-restore/config/* ~/.config/opencode/ 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/openchamber" ]; then
              echo "Restoring OpenChamber config files..."
              cp -rv /tmp/opencode-restore/openchamber/* ~/.config/openchamber/ 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/auth.json" ]; then
              echo "Restoring auth.json..."
              cp -v /tmp/opencode-restore/auth.json ~/.local/share/opencode/auth.json 2>/dev/null || true
            fi

            if [ -f "/tmp/opencode-restore/opencode.db" ]; then
              echo "Restoring SQLite database..."
              cp -v /tmp/opencode-restore/opencode.db* ~/.local/share/opencode/ 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/state" ]; then
              echo "Restoring state directory..."
              cp -rv /tmp/opencode-restore/state/* ~/.local/state/opencode/ 2>/dev/null || true
            fi

            if [ -d "/tmp/opencode-restore/project" ]; then
              echo "Restoring project sessions..."
              cp -rv /tmp/opencode-restore/project/* ~/.local/share/opencode/project/ 2>/dev/null || true
              echo "Sessions restored: $(find ~/.local/share/opencode/project -type f 2>/dev/null | wc -l) files"
            fi

            if [ -d "/tmp/opencode-restore/storage" ]; then
              echo "Restoring legacy storage..."
              mkdir -p ~/.local/share/opencode/storage
              cp -rv /tmp/opencode-restore/storage/* ~/.local/share/opencode/storage/ 2>/dev/null || true
            fi

            echo "Session restored successfully!"
          else
            echo "No previous session found. Fresh start."
          fi

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tools
        run: |
          npm install -g opencode-ai @openchamber/web
          sudo apt update
          sudo apt install jq lsof coreutils curl openssl dnsutils -y

      - name: Connect to Tailscale
        if: ${{ github.event.inputs.tunnel_provider == 'tailscale' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Allow runner user to manage Tailscale
        if: ${{ github.event.inputs.tunnel_provider == 'tailscale' }}
        run: sudo tailscale set --operator="$USER"

      - name: Configure OpenCode (Complete Antigravity Suite)
        run: |
          mkdir -p ~/.config/opencode
          cat << 'EOF' > ~/.config/opencode/opencode.json
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": ["opencode-antigravity-auth@beta"],
            "provider": {
