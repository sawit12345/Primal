                      "output": ["text"]
                    },
                    "limit": {
                      "context": 400000,
                      "output": 128000
                    },
                    "variants": {
                      "low": {
                        "reasoningEffort": "low",
                        "reasoningSummary": "detailed"
                      },
                      "medium": {
                        "reasoningEffort": "medium",
                        "reasoningSummary": "detailed"
                      },
                      "high": {
                        "reasoningEffort": "high",
                        "reasoningSummary": "detailed"
                      },
                      "xhigh": {
                        "reasoningEffort": "xhigh",
                        "reasoningSummary": "detailed"
                      }
                    }
                  }
                }
              },
              "noobrouter-backup": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NoobroRouter Backup",
                "options": {
                  "baseURL": "https://noobrouterproduction.azurewebsites.net/v1",
                  "apiKey": "sk-gpt"
                },
                "models": {
                  "gpt-5.4": {
                    "name": "GPT-5.4 (Backup)",
                    "attachment": true,
                    "modalities": {
                      "input": ["text", "image", "pdf"],
                      "output": ["text"]
                    },
                    "limit": {
                      "context": 1050000,
                      "output": 128000
                    },
                    "variants": {
                      "none": {
                        "reasoningEffort": "none"
                      },
                      "low": {
                        "reasoningEffort": "low",
                        "reasoningSummary": "detailed"
                      },
                      "medium": {
                        "reasoningEffort": "medium",
                        "reasoningSummary": "detailed"
                      },
                      "high": {
                        "reasoningEffort": "high",
                        "reasoningSummary": "detailed"
                      },
                      "xhigh": {
                        "reasoningEffort": "xhigh",
                        "reasoningSummary": "detailed"
                      }
                    }
                  },
                  "gpt-5.3-codex": {
                    "name": "GPT-5.3-Codex (Backup)",
                    "attachment": true,
                    "modalities": {
                      "input": ["text", "image", "pdf"],
                      "output": ["text"]
                    },
                    "limit": {
                      "context": 400000,
                      "output": 128000
                    },
                    "variants": {
                      "low": {
                        "reasoningEffort": "low",
                        "reasoningSummary": "detailed"
                      },
                      "medium": {
                        "reasoningEffort": "medium",
                        "reasoningSummary": "detailed"
                      },
                      "high": {
                        "reasoningEffort": "high",
                        "reasoningSummary": "detailed"
                      },
                      "xhigh": {
                        "reasoningEffort": "xhigh",
                        "reasoningSummary": "detailed"
                      }
                    }
                  }
                }
              },
              "google": {
                "models": {
                  "antigravity-gemini-3-pro": {
                    "name": "Gemini 3 Pro (Antigravity)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingLevel": "low" },
                      "high": { "thinkingLevel": "high" }
                    }
                  },
                  "antigravity-gemini-3-flash": {
                    "name": "Gemini 3 Flash (Antigravity)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "minimal": { "thinkingLevel": "minimal" },
                      "low": { "thinkingLevel": "low" },
                      "medium": { "thinkingLevel": "medium" },
                      "high": { "thinkingLevel": "high" }
                    }
                  },
                  "antigravity-claude-sonnet-4-5": {
                    "name": "Claude Sonnet 4.5 (no thinking) (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "antigravity-claude-sonnet-4-5-thinking": {
                    "name": "Claude Sonnet 4.5 Thinking (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingConfig": { "thinkingBudget": 8192 } },
                      "max": { "thinkingConfig": { "thinkingBudget": 32768 } }
                    }
                  },
                  "antigravity-claude-opus-4-5-thinking": {
                    "name": "Claude Opus 4.5 Thinking (Antigravity)",
                    "limit": { "context": 200000, "output": 64000 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] },
                    "variants": {
                      "low": { "thinkingConfig": { "thinkingBudget": 8192 } },
                      "max": { "thinkingConfig": { "thinkingBudget": 32768 } }
                    }
                  },
                  "gemini-2.5-flash": {
                    "name": "Gemini 2.5 Flash (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-2.5-pro": {
                    "name": "Gemini 2.5 Pro (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-3-flash-preview": {
                    "name": "Gemini 3 Flash Preview (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65536 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  },
                  "gemini-3-pro-preview": {
                    "name": "Gemini 3 Pro Preview (Gemini CLI)",
                    "limit": { "context": 1048576, "output": 65535 },
                    "modalities": { "input": ["text", "image", "pdf"], "output": ["text"] }
                  }
                }
              }
            }
          }
          EOF

      - name: Initial Startup
        run: |
          nohup stdbuf -oL opencode web --port 8080 > opencode.log 2>&1 &
          nohup stdbuf -oL openchamber --port 9090 > openchamber.log 2>&1 &

          echo "Waiting for OpenChamber to listen on 9090..."
          for i in {1..60}; do
            if lsof -i :9090 >/dev/null 2>&1; then
              echo "OpenChamber is listening on 9090"
              break
            fi
            sleep 2
          done

          if ! lsof -i :9090 >/dev/null 2>&1; then
            echo "OpenChamber never started listening on 9090"
            echo "=== openchamber.log ==="
            cat openchamber.log || true
            exit 1
          fi

          if [[ "${{ github.event.inputs.tunnel_provider }}" == "tailscale" ]]; then
            echo "Using Tailscale Funnel..."
            tailscale status || true
            tailscale funnel reset >/dev/null 2>&1 || true

            if ! tailscale funnel --bg --yes http://127.0.0.1:9090 > tunnel.log 2>&1; then
              echo "Tailscale Funnel failed:"
              cat tunnel.log || true
              tailscale funnel status || true
              exit 1
            fi

            URL=$(tailscale funnel status 2>/dev/null | grep -Eo 'https://[^ ]+' | head -n 1)
            if [ -z "$URL" ]; then
              echo "Could not determine Tailscale Funnel URL"
              tailscale funnel status || true
              cat tunnel.log || true
              exit 1
            fi

            echo "URL=$URL" >> "$GITHUB_ENV"
            echo "Funnel URL: $URL"

          elif [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
            curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt update && sudo apt install ngrok -y
            ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
            nohup ngrok http 127.0.0.1:9090 --log=stdout > tunnel.log 2>&1 &
            sleep 10
            echo "URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')" >> "$GITHUB_ENV"

          else
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb
            nohup cloudflared tunnel --url http://127.0.0.1:9090 > tunnel.log 2>&1 &
            sleep 15
            echo "URL=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel.log | tail -n 1)" >> "$GITHUB_ENV"
          fi

      - name: Debug Tailscale Funnel
        if: ${{ github.event.inputs.tunnel_provider == 'tailscale' }}
        continue-on-error: true
        run: |
          echo "=== URL FROM ENV ==="
          echo "${{ env.URL }}"

          HOST=$(echo "${{ env.URL }}" | sed 's#https://##; s#/##')
          echo "HOST=$HOST"

          echo "=== LOCAL APP CHECK ==="
          curl -svI http://127.0.0.1:9090/ || true

          echo "=== TAILSCALE STATUS ==="
          tailscale status || true

          echo "=== FUNNEL STATUS ==="
          tailscale funnel status || true
          tailscale funnel status --json || true

          echo "=== SYSTEM DNS ==="
          getent ahosts "$HOST" || true

          echo "=== PUBLIC DNS VIA 1.1.1.1 ==="
          dig +short "$HOST" @1.1.1.1 || true

          echo "=== PUBLIC DNS VIA 8.8.8.8 ==="
          dig +short "$HOST" @8.8.8.8 || true

          echo "=== TLS HANDSHAKE ==="
          timeout 15 bash -lc "echo | openssl s_client -connect ${HOST}:443 -servername ${HOST}" || true

          echo "=== HTTPS HEAD ==="
          curl -vkI "https://${HOST}/" || true

          echo "=== OPENCHAMBER LOG (TAIL 100) ==="
          tail -n 100 openchamber.log || true

          echo "=== TUNNEL LOG ==="
          cat tunnel.log || true

      - name: Monitor & Self-Heal
        run: |
          echo "------------------------------------------"
          echo "SERVER LIVE AT: ${{ env.URL }}"
          echo "AUTO-SHUTDOWN IN: ${{ github.event.inputs.timeout_minutes }} minute(s)"
          echo "All your repos available at: ~/repos/"
          echo "------------------------------------------"

          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=$(( ${{ github.event.inputs.timeout_minutes }} * 60 ))

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))
            REMAINING=$(( TIMEOUT_SECONDS - ELAPSED ))

            if [ $REMAINING -le 0 ]; then
              echo "[$(date)] Timeout reached. Initiating graceful shutdown..."

              if [[ "${{ github.event.inputs.tunnel_provider }}" == "tailscale" ]]; then
                tailscale funnel reset >/dev/null 2>&1 || true
              fi

              pkill -f "opencode|openchamber|ngrok|cloudflared" 2>/dev/null || true
              break
            fi

            if [ $(( ELAPSED % 300 )) -lt 10 ]; then
              echo "[$(date)] Time remaining: $(( REMAINING / 60 )) minutes"
            fi

            if ! lsof -i :9090 > /dev/null; then
              echo "[$(date)] Restoring OpenChamber..."
              nohup stdbuf -oL openchamber --port 9090 >> openchamber.log 2>&1 &
              sleep 10
            fi

            if [[ "${{ github.event.inputs.tunnel_provider }}" == "ngrok" ]]; then
              if ! pgrep -f "ngrok" > /dev/null; then
                echo "[$(date)] Re-hosting ngrok tunnel..."
                nohup ngrok http 127.0.0.1:9090 --log=stdout > tunnel.log 2>&1 &
                sleep 10
                URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
                echo "NEW LINK: $URL"
              fi

            elif [[ "${{ github.event.inputs.tunnel_provider }}" == "cloudflare" ]]; then
              if ! pgrep -f "cloudflared" > /dev/null; then
                echo "[$(date)] Re-hosting Cloudflare tunnel..."
                nohup cloudflared tunnel --url http://127.0.0.1:9090 > tunnel.log 2>&1 &
                sleep 15
                URL=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel.log | tail -n 1)
                echo "NEW LINK: $URL"
              fi

            else
              if ! tailscale funnel status 2>/dev/null | grep -q 'https://'; then
                echo "[$(date)] Re-hosting Tailscale Funnel..."
                if tailscale funnel --bg --yes http://127.0.0.1:9090 > tunnel.log 2>&1; then
                  sleep 5
                  URL=$(tailscale funnel status 2>/dev/null | grep -Eo 'https://[^ ]+' | head -n 1)
                  echo "NEW LINK: $URL"
                else
                  echo "[$(date)] Tailscale Funnel restart failed:"
                  cat tunnel.log || true
                fi
              fi
            fi

            tail -n 1 openchamber.log
            sleep 5
          done

      - name: Prepare Session Data for Save
        if: always()
        run: |
          echo "Preparing session data for persistence..."
          mkdir -p /tmp/opencode-save/config /tmp/opencode-save/openchamber /tmp/opencode-save/project /tmp/opencode-save/state /tmp/opencode-save/storage

          if [ -d "$HOME/.config/opencode" ] && [ "$(ls -A "$HOME/.config/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/opencode/"* /tmp/opencode-save/config/ 2>/dev/null || true
            echo "OpenCode config saved: $(ls -la /tmp/opencode-save/config/ 2>/dev/null | wc -l) files"
          else
            echo "No OpenCode config data to save"
          fi

          if [ -d "$HOME/.config/openchamber" ] && [ "$(ls -A "$HOME/.config/openchamber" 2>/dev/null)" ]; then
            cp -rv "$HOME/.config/openchamber/"* /tmp/opencode-save/openchamber/ 2>/dev/null || true
            echo "OpenChamber config saved: $(find "$HOME/.config/openchamber" -type f 2>/dev/null | wc -l) files"
          else
            echo "No OpenChamber config data to save"
          fi

          if [ -f "$HOME/.local/share/opencode/auth.json" ]; then
            cp -v "$HOME/.local/share/opencode/auth.json" /tmp/opencode-save/auth.json 2>/dev/null || true
            echo "Auth data saved"
          fi

          if [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            cp -v "$HOME/.local/share/opencode/opencode.db"* /tmp/opencode-save/ 2>/dev/null || true
            echo "SQLite database saved: $(ls -la /tmp/opencode-save/opencode.db* 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/state/opencode" ] && [ "$(ls -A "$HOME/.local/state/opencode" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/state/opencode/"* /tmp/opencode-save/state/ 2>/dev/null || true
            echo "State data saved: $(find "$HOME/.local/state/opencode" -type f 2>/dev/null | wc -l) files"
          fi

          if [ -d "$HOME/.local/share/opencode/project" ] && [ "$(ls -A "$HOME/.local/share/opencode/project" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/project/"* /tmp/opencode-save/project/ 2>/dev/null || true
            echo "Project sessions saved: $(find "$HOME/.local/share/opencode/project" -type f 2>/dev/null | wc -l) files"
          else
            echo "No project session data to save"
          fi

          if [ -d "$HOME/.local/share/opencode/storage" ] && [ "$(ls -A "$HOME/.local/share/opencode/storage" 2>/dev/null)" ]; then
            cp -rv "$HOME/.local/share/opencode/storage/"* /tmp/opencode-save/storage/ 2>/dev/null || true
            echo "Legacy storage saved: $(find "$HOME/.local/share/opencode/storage" -type f 2>/dev/null | wc -l) files"
          fi

          if [ "$(find /tmp/opencode-save -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Session data prepared successfully: $(find /tmp/opencode-save -type f | wc -l) files total"
            ls -la /tmp/opencode-save/
          else
            echo "No session data to save - creating placeholder"
            echo "$(date): No session data available" > /tmp/opencode-save/placeholder.txt
          fi

      - name: Upload Session Data (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session
          path: /tmp/opencode-save/
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
