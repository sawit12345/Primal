[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primal-framework"
version = "0.1.0"
description = "Primal: a lightweight sub-symbolic adaptive learning framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Primeval" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "gymnasium>=0.29",
  "scikit-learn>=1.4",
  "psutil>=5.9",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["brain"]
py-modules = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
